</style><header><a href="../../index.html" aria-label="Back to arcade">← ARCADE</a><strong>PULSE VAULT</strong><span id="status">FIVE SIGNALS / ONE BUTTON</span><button id="pause">Pause</button><button id="sound" aria-label="Mute audio">♫</button><label>Vol <input id="volume" aria-label="Audio volume" type="range" min="0" max="100" value="65"></label></header><div id="readout"></div><main><canvas id="c" width="960" height="540" aria-label="Pulse Vault rhythm platformer"></canvas><button id="tap">JUMP</button><section id="panel"></section></main><div id="tip">SPACE / ↑ / Z / tap: jump · Hold to repeat on landing · R: retry · ESC: pause · Practice uses safe automatic flags. Normal clears earn medals. Progress saves on this device.</div><script>
'use strict';
// Extends the checkpoint's Impossible Game prototype: 120 Hz fixed impulse,

const cv=document.querySelector('#c'),g=cv.getContext('2d'),panel=document.querySelector('#panel');

function persist(){try{localStorage.setItem('pulse-vault-v1',JSON.stringify(save))}catch{}}
// Phrase vocabulary: singles/doubles/triples, gaps, low/high landing blocks.
// Four beats of empty runway head every phrase; safe flags precede each new phrase.
const phrases={A:'s...s...d...',B:'g...s...b...',C:'d...b...g...',D:'b...s...t...',E:'g...d...h...',F:'t...g...b...',G:'h...d...g...',H:'d..s..b.....',I:'g...t...h...',J:'b..d..g.....',K:'t..b..d.....',L:'h...g...t...'};
const compositions=[['A','A','B','A','C','B','D','A','C','D'],['B','C','D','B','E','D','C','F','E','B','F'],['C','E','F','G','D','F','H','E','G','F','H','D'],['E','G','I','H','F','J','I','G','H','J','I','F','L'],['G','I','K','J','L','H','K','I','L','J','K','L','I','K']];
const names=['Amber Signal','Glass Circuit','Violet Current','Blue Hour','Last Transmission'];
const colors=['#e9ad66','#91dfd8','#d9a6ed','#8bbbed','#f39c9c'];
const roots=[45,50,48,43,52],melodies=[[0,7,12,7,3,7,10,7],[0,12,7,3,0,10,7,5],[0,3,7,10,12,10,7,3],[0,7,5,12,10,7,3,5],[0,12,10,7,3,7,15,12]];
const levels=compositions.map((a,i)=>{let obs=[],flags=[];a.forEach((p,k)=>{let base=(k*16+4)*BEAT;flags.push(k*16*BEAT);[...phrases[p]].forEach((c,j)=>{let x=base+j*BEAT;if(c==='.')return;if('sdt'.includes(c))for(let q=0;q<({s:1,d:2,t:3}[c]);q++)obs.push({t:'spike',x:x+q*36,w:36,h:34});else if(c==='g')obs.push({t:'gap',x,w:i>2?178:160});else obs.push({t:'block',x,w:c==='h'?110:120,h:c==='h'?100:64})})});return{name:names[i],color:colors[i],obstacles:obs,flags,end:a.length*16*BEAT,root:roots[i],melody:melodies[i]}});
let selected=0,practice=false,mode='title',x=0,y=G-S,vy=0,grounded=true,rot=0,attempt=0,deaths=0,flag=0,dead=0,sim=0,buffer=-99,held=false,particles=[],trail=[],lastBeat=-1;
let ac,master,musicStep=-1;function audio(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.connect(ac.destination)}if(ac.state==='suspended')ac.resume();master.gain.value=save.muted?0:save.volume*.35}
function note(f,d=.12,vol=.2,w='triangle',end){if(!ac||ac.state!=='running')return;let o=ac.createOscillator(),a=ac.createGain(),t=ac.currentTime;o.type=w;o.frequency.setValueAtTime(f,t);if(end)o.frequency.exponentialRampToValueAtTime(end,t+d);a.gain.setValueAtTime(.001,t);a.gain.linearRampToValueAtTime(vol,t+.005);a.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(a);a.connect(master);o.start(t);o.stop(t+d+.02)}
function music(){let b=Math.floor(x/BEAT*2);if(b===musicStep)return;musicStep=b;let l=levels[selected],m=l.melody[(b>>1)%8];if(b%2===0)note(440*2**((l.root+m-69)/12),.16,.11,'triangle');if(b%4===0){note(76,.14,.25,'sine',32);note(440*2**((l.root-12-69)/12),.32,.10,'sawtooth')}if(b%2===1)note(3800,.025,.025,'square',1900)}
function newRun(){audio();attempt=0;deaths=0;flag=0;mode='play';panel.classList.add('hidden');respawn();}
function respawn(){attempt++;save.attempts[selected]++;x=practice?flag:0;y=G-S;vy=0;grounded=true;rot=0;dead=0;sim=x/SPEED;buffer=-99;trail=[];musicStep=-1;persist()}
function jump(){if(mode!=='play'||dead)return;audio();buffer=sim+save.offset/1000;}
function die(){dead=.158;deaths++;save.best[selected]=Math.max(save.best[selected],Math.min(1,x/levels[selected].end));persist();note(150,.11,.4,'sawtooth',30);for(let i=0;i<24;i++)particles.push({x:x+17,y:y+17,vx:(Math.random()-.5)*380,vy:-Math.random()*360,life:.4})}
function step(dt){if(mode!=='play')return;for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=1100*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);if(dead){dead-=dt;if(dead<=0)respawn();return}sim+=dt;x+=SPEED*dt;const l=levels[selected];let floor=G,inGap=false;for(const o of l.obstacles){if(o.t==='gap'&&x+S/2>=o.x&&x+S/2<=o.x+o.w)inGap=true;if(o.t==='block'&&x+S>o.x&&x<o.x+o.w&&y+S<=G-o.h+4)floor=Math.min(floor,G-o.h)}if(inGap&&floor===G)floor=-Infinity;let prev=y+S;if(grounded&&floor>prev+1||floor===-Infinity)grounded=false;if(!grounded){vy+=GRAV*dt;y+=vy*dt;if(vy>=0&&prev<=floor+5&&y+S>=floor){y=floor-S;vy=0;grounded=true;rot=Math.round(rot/(Math.PI/2))*(Math.PI/2)}}
if(grounded&&sim>=buffer&&(held||sim-buffer<=.09)){vy=-JUMP;grounded=false;buffer=-99;note(450,.035,.04)}if(!grounded)rot+=dt*4.2;
if(practice)for(const f of l.flags)if(x>=f&&f>flag)flag=f;
for(const o of l.obstacles){if(o.x>x+S+5||o.x+o.w<x)continue;if(o.t==='block'&&x+S>o.x+1&&x<o.x+o.w-1&&y+S>G-o.h+3&&y<G)return die();if(o.t==='spike'){let near=clamp(o.x+o.w/2,x+4,x+S-4),height=o.h*(1-Math.abs(near-o.x-o.w/2)/(o.w/2));if(y+S-3>G-height&&height>0)return die()}}
if(floor===-Infinity&&y+S>G+8||y>H+100)return die();music();trail.push({x,y});if(trail.length>12)trail.shift();if(x>=l.end){save.best[selected]=1;if(!practice)save.clear[selected]=true;persist();mode='clear';note(523,.3,.25);setTimeout(()=>note(659,.25,.2),100);setTimeout(()=>note(784,.4,.2),200);show()}}
function pause(){held=false;if(mode==='play'){mode='pause';show()}else if(mode==='pause'){mode='play';panel.classList.add('hidden');audio();musicStep=-1}}
function show(){panel.classList.remove('hidden');let title=mode==='clear'?(practice?'Signal rehearsed':'Signal secured'):mode==='pause'?'Hold the signal.':'PULSE VAULT';panel.innerHTML=`<div class="card"><div class="eyebrow">ONE BUTTON · FIVE ORIGINAL TRACKS</div><h1>${title}</h1><div class="sub">${mode==='clear'?`${levels[selected].name} · ${attempt} attempts · ${deaths} collisions. ${practice?'Try normal mode to earn its medal.':'Your medal is saved. Keep the signal moving.'}`:mode==='pause'?'Take a breath. Your position and music phase are held.':'A square, a fixed jump, a perfect moment. Follow the pulse through five increasingly intricate signals.'}</div><div class="levels">${levels.map((l,i)=>`<button class="level ${i===selected?'selected':''}" data-level="${i}">0${i+1} ${save.clear[i]?'◆':''}<br>${l.name}<small>${l.end/SPEED}s · ${Math.floor(clamp(save.best[i],0,1)*100)}% BEST</small></button>`).join('')}</div><div class="row"><button class="primary" id="start">${mode==='pause'?'Resume signal':mode==='clear'&&selected<4?'Next signal':'Enter signal'}</button><button id="practice">Practice: ${practice?'ON':'OFF'}</button>${mode==='pause'?'<button id="retry">Restart</button>':''}<button id="menu">Track selection</button></div><div class="row"><label>Input delay <select id="offset">${[0,10,20,30,40,60,80,100,150].map(n=>`<option ${n===save.offset?'selected':''} value="${n}">${n} ms</option>`).join('')}</select></label><span style="font-size:12px;color:#95a1b7">Tap registers on press. Delay is optional; 0 ms is fastest.</span></div></div>`;
for(const b of panel.querySelectorAll('[data-level]'))b.onclick=()=>{selected=+b.dataset.level;mode='title';show()};$('#start').onclick=()=>{if(mode==='pause')pause();else{if(mode==='clear'&&selected<4)selected++;newRun()}};$('#practice').onclick=()=>{practice=!practice;mode='title';show()};$('#menu').onclick=()=>{mode='title';show()};if($('#retry'))$('#retry').onclick=newRun;$('#offset').onchange=e=>{save.offset=+e.target.value;persist()}}
$('#pause').onclick=pause;$('#sound').onclick=()=>{save.muted=!save.muted;audio();persist();$('#sound').textContent=save.muted?'♪ OFF':'♫ ON'};$('#sound').textContent=save.muted?'♪ OFF':'♫ ON';$('#volume').value=save.volume*100;$('#volume').oninput=e=>{save.volume=+e.target.value/100;audio();persist()};
addEventListener('keydown',e=>{if(e.target.matches('input,select')||e.target.closest('button,a')&&['Space','Enter'].includes(e.code))return;if(['Space','ArrowUp','KeyZ','Escape','ArrowDown'].includes(e.code))e.preventDefault();if(e.repeat)return;if(e.code==='Escape')pause();if(e.code==='KeyR'&&mode!=='title')newRun();if(['Space','ArrowUp','KeyZ'].includes(e.code)){if(mode==='title'||mode==='clear')newRun();else{held=true;jump()}}if(e.code==='Enter'&&mode==='title')newRun()});addEventListener('keyup',e=>{if(['Space','ArrowUp','KeyZ'].includes(e.code))held=false});
for(const el of [cv,$('#tap')])el.addEventListener('pointerdown',e=>{e.preventDefault();held=true;jump();el.setPointerCapture?.(e.pointerId)});addEventListener('pointerup',()=>held=false);addEventListener('pointercancel',()=>held=false);addEventListener('blur',()=>{held=false;if(mode==='play')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')pause()});
function draw(now){let l=levels[selected],cam=x-210,beat=(x/BEAT)%1;$('#readout').textContent=`${l.name} · ${practice?'PRACTICE':'NORMAL'} · ATTEMPT ${attempt||1} · ${Math.min(100,Math.floor(x/l.end*100))}%`;g.fillStyle='#171d2a';g.fillRect(0,0,W,H);let grd=g.createLinearGradient(0,0,0,H);grd.addColorStop(0,l.color+'16');grd.addColorStop(1,'#171d2a');g.fillStyle=grd;g.fillRect(0,0,W,H);g.strokeStyle=l.color+'13';g.lineWidth=1;for(let q=0;q<15;q++){let bx=q*100-(cam*.2%100);g.beginPath();g.moveTo(bx,0);g.lineTo(bx,H);g.stroke()}for(let q=0;q<6;q++){g.beginPath();g.moveTo(0,70+q*60);g.lineTo(W,70+q*60);g.stroke()}g.fillStyle=l.color+'0a';g.font='900 180px system-ui';g.fillText('0'+(selected+1),660,250);g.fillStyle='#090e18';g.fillRect(0,G,W,H-G);g.fillStyle=l.color;g.fillRect(0,G,W,2);g.save();g.translate(-cam,0);
for(const o of l.obstacles){if(o.x+o.w<cam||o.x>cam+W)continue;if(o.t==='gap'){g.fillStyle='#050811';g.fillRect(o.x,G,o.w,H-G);g.fillStyle=l.color+'55';g.fillRect(o.x-3,G,3,50);g.fillRect(o.x+o.w,G,3,50);g.fillStyle=l.color+'24';g.fillRect(o.x+5,G+14,o.w-10,3)}else if(o.t==='block'){g.fillStyle='#586778';g.fillRect(o.x,G-o.h,o.w,o.h);g.fillStyle='#c6d3df';g.fillRect(o.x,G-o.h,o.w,3);g.strokeStyle='#8ba0b5';g.strokeRect(o.x+6,G-o.h+8,o.w-12,o.h-14)}else{g.beginPath();g.moveTo(o.x,G);g.lineTo(o.x+o.w/2,G-o.h);g.lineTo(o.x+o.w,G);g.closePath();g.fillStyle='#f9dfdc';g.fill();g.fillStyle='#d97474';g.beginPath();g.moveTo(o.x+o.w/2,G-o.h+5);g.lineTo(o.x+o.w/2,G-2);g.lineTo(o.x+o.w-2,G-2);g.fill()}}
if(practice)for(const f of l.flags){if(f<cam||f>cam+W)continue;g.fillStyle=f<=flag?'#a4e6b5':'#708a99';g.fillRect(f,G-60,3,60);g.beginPath();g.moveTo(f+3,G-60);g.lineTo(f+25,G-50);g.lineTo(f+3,G-40);g.fill()}
g.fillStyle=l.color;g.fillRect(l.end,G-230,4,230);g.fillRect(l.end+4,G-230,90,40);if(!dead){for(let j=0;j<trail.length;j++){g.globalAlpha=j/trail.length*.14;g.fillStyle=l.color;g.fillRect(trail[j].x,trail[j].y,S,S)}g.globalAlpha=1;g.save();g.translate(x+17,y+17);g.rotate(rot);g.shadowColor=l.color;g.shadowBlur=18;g.fillStyle=l.color;g.fillRect(-17,-17,34,34);g.shadowBlur=0;g.strokeStyle='#fff7e8';g.lineWidth=2;g.strokeRect(-12,-12,24,24);g.fillStyle='#29293c';g.fillRect(-5,-5,10,10);g.restore()}for(const p of particles){g.globalAlpha=p.life/.4;g.fillStyle=l.color;g.fillRect(p.x,p.y,5,5)}g.globalAlpha=1;g.restore();g.fillStyle='#f8f4ed';g.font='700 15px system-ui';g.fillText(l.name.toUpperCase(),26,36);g.fillStyle='#abb9cc';g.font='12px monospace';g.fillText(`ATTEMPT ${attempt||1}   ${practice?'PRACTICE':'NORMAL'}   ${Math.min(100,Math.floor(x/l.end*100))}%`,26,58);g.fillStyle='#ffffff15';g.fillRect(26,71,908,3);g.fillStyle=l.color;g.fillRect(26,71,908*clamp(x/l.end,0,1),3);g.fillStyle=l.color;g.globalAlpha=.3+(1-beat)*.7;g.beginPath();g.arc(914,35,5,0,7);g.fill();g.globalAlpha=1;g.font='11px monospace';g.fillStyle='#94a4bc';g.fillText('120 BPM / FIXED IMPULSE',26,510);if(mode==='play'&&x<700){g.font='16px system-ui';g.fillStyle='#c9d0dc';g.fillText('Tap / SPACE to jump. Feel the pulse.',300,200)}}
let last=performance.now(),acc=0;function frame(now){acc+=Math.min(.075,(now-last)/1000);last=now;while(acc>=DT){step(DT);acc-=DT}draw(now);requestAnimationFrame(frame)}show();requestAnimationFrame(frame);
Object.defineProperty(window,'__game',{value:Object.freeze({get state(){return{mode,level:selected,practice,x,y,grounded,attempt,deaths,paused:mode==='pause',flag,progress:x/levels[selected].end,dead,volume:save.volume,muted:save.muted,levels:levels.map(l=>({name:l.name,end:l.end,obstacles:l.obstacles.map(o=>({...o})),flags:[...l.flags]})),best:[...save.best],cleared:[...save.clear]}}})});
