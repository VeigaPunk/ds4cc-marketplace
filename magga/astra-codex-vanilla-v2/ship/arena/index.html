<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111916"><title>Bastion Afterdark</title><link rel="stylesheet" href="style.css"></head>
<body><div id="shell">
<header><a href="../../index.html" aria-label="Return to arcade">← ARCADE</a><span class="brand">BASTION <b>AFTERDARK</b></span><div class="tools"><button id="pause" aria-label="Pause game">Ⅱ PAUSE</button><button id="settings" aria-label="Settings">SETTINGS</button><button id="mute" aria-label="Mute audio">♫ ON</button></div></header>
<main id="stage"><canvas id="game" width="640" height="400" tabindex="0" aria-label="Arena battlefield. Move with WASD; hold Space to fire in your facing direction. Mouse aim and touch controls are available."></canvas><div id="hud" hidden><div id="status"></div><div id="players"></div></div><div id="toast" aria-live="polite"></div><section id="panel" aria-label="Game menu"></section></main>
<div id="touch" hidden><div class="touch-half" data-player="0"><div class="stick" data-player="0" aria-label="Player one movement pad"><span></span><b>P1</b></div><button class="fire" data-player="0">FIRE</button><button class="cycle" data-player="0">P1 WEAPON</button></div><div class="touch-half" data-player="1"><div class="stick" data-player="1" aria-label="Player two movement pad"><span></span><b>P2</b></div><button class="fire" data-player="1">FIRE</button><button class="cycle" data-player="1">P2 WEAPON</button></div></div>
<footer><span id="hint">WASD / arrows move · Space fires · Mouse aims · Esc pauses</span><span class="edition">LOCAL ARCADE / 01</span></footer></div><script src="game.js"></script></body></html>
