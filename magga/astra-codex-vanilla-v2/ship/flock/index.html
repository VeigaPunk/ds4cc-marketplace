function buildSprites() {
  SPR.packId = pack.id;
  SPR.bg = mkSpr(W, H, bgArt);
  SPR.planet = mkSpr(240, 240, planetArt);
  SPR.banner = mkSpr(W, 96, bannerArt);
  SPR.star = [
    mkSpr(6, 6, g => { g.fillStyle = 'rgba(255,255,255,.9)'; g.beginPath(); g.arc(3, 3, 1.3, 0, 7); g.fill(); }),
    mkSpr(9, 9, g => { const r = g.createRadialGradient(4.5, 4.5, 0, 4.5, 4.5, 4.5); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.45, 'rgba(255,255,255,.75)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, 9, 9); }),
    mkSpr(15, 15, g => { const r = g.createRadialGradient(7.5, 7.5, 0, 7.5, 7.5, 7.5); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.35, 'rgba(230,240,255,.55)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, 15, 15);
      g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = .9;
      g.beginPath(); g.moveTo(7.5, 1); g.lineTo(7.5, 14); g.moveTo(1, 7.5); g.lineTo(14, 7.5); g.stroke(); })
  ];
  SPR.birdUp = mkSpr(56, 56, g => { g.translate(28, 30); birdArt(g, 1, 'up', false); });
  SPR.birdDn = mkSpr(56, 56, g => { g.translate(28, 30); birdArt(g, 1, 'down', false); });
  SPR.birdDive = mkSpr(56, 64, g => { g.translate(28, 36); birdArt(g, 1, 'dive', false); });
  SPR.boss = mkSpr(200, 190, g => bossArt(g, false));
  SPR.bossMad = mkSpr(200, 190, g => bossArt(g, true));
  SPR.ship = [0, 1, 2].map(lv => mkSpr(48, 56, g => { g.translate(24, 30); shipArt(g, lv); }));
  SPR.flame = [0, 1, 2].map(i => mkSpr(20, 30, g => flameArt(g, i)));
  SPR.bullet = mkSpr(20, 30, bulletArt);
  SPR.missile = mkSpr(24, 44, missileArt);
  SPR.egg = mkSpr(18, 22, eggArt);
  SPR.puff = mkSpr(32, 32, puffArt);
  SPR.gift = mkSpr(36, 36, giftArt);
  SPR.food = mkSpr(36, 36, foodArt);
}

function draw() {
  $('#readout').textContent=mode==='title'?`${pack.title} · 11 SYSTEMS · 110 WAVES`:`SYSTEM ${chapter} · WAVE ${Math.min(10,waveIdx+1)} · HULL ${lives} · SPECIAL ${missileN} · ${score.toLocaleString()} PTS`;
  const now = performance.now() / 1000;
  const ddt = drawLast < 0 ? 0 : Math.min(0.1, now - drawLast);
  drawLast = now; drawT = now;
  if (SPR.packId !== pack.id) buildSprites();
  titleT0 = mode === 'title' ? (titleT0 < 0 ? drawT : titleT0) : -1;

  ctx.drawImage(SPR.bg, 0, 0);
  // planet / ringed moon silhouette — slow parallax drift, low in frame
  ctx.globalAlpha = .9;
  ctx.drawImage(SPR.planet, W * .82 - 120 + Math.sin(drawT * .045) * 12, H - 178 + Math.sin(drawT * .03) * 4);
  ctx.globalAlpha = 1;
  // stars: 3 tiers, twinkle, two parallax speeds (s.v scrolls in step)
  for (const s of stars) {
    ctx.globalAlpha = s.a * (.62 + .38 * Math.sin(drawT * s.tw + s.x * .7));
    ctx.drawImage(SPR.star[s.tier], s.x - s.o, s.y - s.o);
  }
  ctx.globalAlpha = 1;

  if (mode === 'title') return;

  // pickups: icon + bob + pack glow ring + sparkles
  for (const p of pickups) {
    const y = p.y + Math.sin(drawT * 4 + p.x * .05) * 3;
    ctx.strokeStyle = rgba(pack.accent, .45 + .3 * Math.sin(drawT * 6 + p.x));
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, y, 15 + Math.sin(drawT * 5 + p.x) * 2.5, 0, 7); ctx.stroke();
    ctx.drawImage(p.kind === 'gift' ? SPR.gift : SPR.food, p.x - 18, y - 18);
    for (let i = 0; i < 3; i++) {
      const a = drawT * 2.6 + i * 2.1 + p.x * .01;
      ctx.globalAlpha = .35 + .55 * Math.abs(Math.sin(drawT * 4.5 + i * 2.3 + p.x));
      ctx.drawImage(SPR.star[1], p.x + Math.cos(a) * 14 - 4.5, y + Math.sin(a) * 12 - 4.5);
    }
    ctx.globalAlpha = 1;
  }
  // chickens
  for (const c of chickens) drawBird(c);
  // boss
  if (boss) {
    const mad = boss.hp < boss.max * .35;
    if (boss.warn > 0) { // telegraph ring (semantics kept)
      ctx.strokeStyle = rgba(pack.accent, .85); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(boss.x, boss.y, 74 + Math.sin(boss.t * 30) * 6, 0, 7); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(boss.x, boss.y, 64 + Math.sin(boss.t * 30) * 6, 0, 7); ctx.stroke();
    }
    const bs = mad ? SPR.bossMad : SPR.boss;
    ctx.drawImage(bs, boss.x - 100, boss.y - 104 + Math.sin(boss.t * 2.2) * 5);
    // framed segmented hp gauge (same rect/position)
    const bx = W / 2 - 160, frac = Math.max(0, boss.hp) / boss.max;
    ctx.fillStyle = 'rgba(0,0,0,.6)'; rrect(bx - 4, 10, 328, 18, 5); ctx.fill();
    const seg = 20, sw = 320 / seg;
    for (let i = 0; i < seg; i++) {
      ctx.fillStyle = frac * seg > i
        ? (mad ? rgba(pack.accent, .7 + .3 * Math.sin(drawT * 10)) : pack.accent)
        : 'rgba(255,255,255,.09)';
      ctx.fillRect(bx + i * sw + 1, 14, sw - 2, 10);
    }
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; rrect(bx - 4, 10, 328, 18, 5); ctx.stroke();
    txt(boss.name, W / 2, 42, '#fff', 11, 'center');
  }
  // eggs: specular ovals w/ wobble
  for (const e of eggs) {
    ctx.save(); ctx.translate(e.x, e.y);
    ctx.rotate(Math.sin(drawT * 7 + e.x * .13 + e.y * .02) * .18);
    ctx.drawImage(SPR.egg, -9, -11);
    ctx.restore();
  }
  // bullets: glowing capsules tilted along velocity
  for (const b of bullets) {
    ctx.save(); ctx.translate(b.x, b.y);
    ctx.rotate(Math.atan2(b.vy, b.vx || 0) + Math.PI / 2);
    ctx.drawImage(SPR.bullet, -10, -15);
    ctx.restore();
  }
  // missile smoke trail (draw-only pool)
  if (!paused) {
    puffAcc += ddt * 55 * missiles.length;
    while (puffAcc >= 1) {
      puffAcc -= 1;
      if (missiles.length && smoke.length < 160) {
        const m = missiles[smokeIdx++ % missiles.length];
        smoke.push({x: m.x + (Math.random() - .5) * 5, y: m.y + 18, r: 3.5 + Math.random() * 3, life: .5, max: .5});
      }
    }
    let sw2 = 0;
    for (const p of smoke) { p.y += 34 * ddt; p.r += 16 * ddt; p.life -= ddt; if (p.life > 0) smoke[sw2++] = p; }
    smoke.length = sw2;
  }
  for (const p of smoke) {
    ctx.globalAlpha = Math.max(0, p.life / p.max) * .4;
    ctx.drawImage(SPR.puff, p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
  }
  ctx.globalAlpha = 1;
  // missiles: finned rockets
  for (const m of missiles) ctx.drawImage(SPR.missile, m.x - 12, m.y - 22);
  // ship (invuln blink gating unchanged)
  if (ship.alive && (ship.invuln <= 0 || (waveT * 16 | 0) % 2 === 0)) drawShip();
  // particles: tagged shapes (feather slivers / ship debris)
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life * 2);
    if (p.sh === 'feather') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(Math.atan2(p.vy, p.vx) + p.spin);
      ctx.fillStyle = p.col; ctx.beginPath(); ctx.ellipse(0, 0, p.s * 1.15, p.s * .38, 0, 0, 7); ctx.fill();
      ctx.restore();
    } else if (p.sh === 'debris') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.spin + p.life * 9);
      ctx.fillStyle = p.col; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s);
      ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .35);
      ctx.restore();
    } else { ctx.fillStyle = p.col; ctx.fillRect(p.x, p.y, p.s, p.s); }
  }
  ctx.globalAlpha = 1;
  // ship-death shockwave ring + white flash (draw-only, keyed to deadT)
  if (mode === 'play' && !ship.alive) {
    const rt = deadT / .45;
    if (rt < 1) {
      ctx.globalAlpha = (1 - rt) * .9; ctx.strokeStyle = '#fff'; ctx.lineWidth = 5 * (1 - rt) + 1;
      ctx.beginPath(); ctx.arc(ship.x, ship.y, 12 + rt * 95, 0, 7); ctx.stroke();
      ctx.globalAlpha = (1 - rt) * .5; ctx.strokeStyle = pack.accent; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ship.x, ship.y, 8 + rt * 70, 0, 7); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (deadT < .035) {
      ctx.fillStyle = `rgba(255,255,255,${(.55 * (1 - deadT / .035)).toFixed(3)})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  drawHUD();
  if (jokeT > 0) center2(waveIdx===9 ? 'WATCH THE WARNING RING. FIND THE OPEN SKY.' : currentWave().name, H-125, pack.accent, 14);
  if (paused) banner('PAUSED');
  
  
  
}
function drawBird(c) {
  if(c.rock){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.t*.6);ctx.beginPath();for(let i=0;i<9;i++){const a=i/9*Math.PI*2,r=i%2?18:23;i?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fillStyle='#887c90';ctx.fill();ctx.strokeStyle='#c2b4ca';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#504b67';ctx.beginPath();ctx.arc(-5,-4,6,0,7);ctx.fill();ctx.restore();return}
  if(c.type===1){ctx.strokeStyle=pack.accent;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(c.x-28,c.y);ctx.lineTo(c.x-40,c.y-14);ctx.moveTo(c.x+28,c.y);ctx.lineTo(c.x+40,c.y-14);ctx.stroke()}
  if(c.type===2){ctx.fillStyle='#94a3b8';ctx.beginPath();ctx.ellipse(c.x,c.y+2,20,17,0,0,7);ctx.fill()}

  if (c.dive) { // tucked wings + speed lines, slight lean into the dive
    ctx.save(); ctx.translate(c.x, c.y);
    ctx.rotate(Math.max(-.45, Math.min(.45, (c.dvx || 0) * .0012)));
    ctx.drawImage(SPR.birdDive, -28, -36);
    ctx.restore();
    return;
  }
  const spr = ((c.t * (c.enter ? 11 : 7) | 0) % 2) ? SPR.birdUp : SPR.birdDn;
  ctx.drawImage(spr, c.x - 28, c.y - 30);
}
function drawShip() {
  ctx.save(); ctx.translate(ship.x, ship.y);
  ctx.rotate(Math.max(-.16, Math.min(.16, ship.vx / SHIP_MAXV * .16))); // bank into motion
  const fl = SPR.flame[(drawT * 24 | 0) % 3];
  ctx.drawImage(fl, -10, 13, 20, 24 + Math.sin(drawT * 31) * 4);
  if(power===11){ctx.strokeStyle=pack.bullet;ctx.lineWidth=1.6;ctx.globalAlpha=.5+.25*Math.sin(drawT*5);ctx.beginPath();ctx.ellipse(0,-3,31,37,0,0,7);ctx.stroke();ctx.globalAlpha=1}
  ctx.drawImage(SPR.ship[weaponLv], -24, -30);
  ctx.restore();
}
function drawHUD() {
  ctx.fillStyle='rgba(4,8,20,.82)';ctx.fillRect(0,0,W,92);
  txt(`SCORE ${score.toLocaleString()}`,18,24,'#ffffff',15);
  txt(`HULL ${'♥'.repeat(Math.max(0,lives))}   SPECIALS ${missileN}`,18,47,'#ffb894',13);
  txt(`${pack.weapons[weaponLv]}  ·  ${power===11?'OVERCHARGE':`POWER ${power}/10`}`,18,71,pack.bullet,12);
  txt(`${pack.systems[chapter-1].toUpperCase()}`,W-18,24,pack.accent,15,'right');
  txt(`SYSTEM ${chapter}/11 · WAVE ${Math.min(10,waveIdx+1)}/10`,W-18,47,'#dae5ee',13,'right');
  txt(boss?boss.name:currentWave()?.name||'ROUTE CLEARED',W-18,71,'#9eafbf',12,'right');
  if(boss){const frac=Math.max(0,boss.hp/boss.max);ctx.fillStyle='#ffffff25';ctx.fillRect(350,16,260,7);ctx.fillStyle=pack.accent;ctx.fillRect(350,16,260*frac,7);txt(boss.name,480,43,'#fff',12,'center');}
  txt(touchMode?(layout==='A'?'LEFT STICK · RIGHT FIRE · SPECIAL':'DRAG TO PILOT · AUTO-FIRE · SPECIAL'):'ARROWS / WASD · SPACE fire · X special · ESC pause',18,H-9,'#9eb1c8',10);
  if (touchMode && mode === 'play') {
    orbBtn(missileBtn(), pack.accent, SPR.missile, missileN > 0, false, 'MISSILE');
    if (layout === 'A') {
      orbBtn(FIRE_BTN_A, '#8ce99a', SPR.bullet, true, firePtrs.size > 0, 'FIRE');
      if (stick) { // translucent base ring + clamped knob
        const dx = stick.x - stick.ox, dy = stick.y - stick.oy, m = Math.hypot(dx, dy);
        const cl = m > 48 ? 48 / m : 1, kx = stick.ox + dx * cl, ky = stick.oy + dy * cl;
        ctx.fillStyle = 'rgba(255,255,255,.06)';
        ctx.beginPath(); ctx.arc(stick.ox, stick.oy, 48, 0, 7); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(stick.ox, stick.oy, 48, 0, 7); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(stick.ox - 48, stick.oy); ctx.lineTo(stick.ox - 38, stick.oy);
        ctx.moveTo(stick.ox + 38, stick.oy); ctx.lineTo(stick.ox + 48, stick.oy);
        ctx.moveTo(stick.ox, stick.oy - 48); ctx.lineTo(stick.ox, stick.oy - 38);
        ctx.moveTo(stick.ox, stick.oy + 38); ctx.lineTo(stick.ox, stick.oy + 48);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,.3)';
        ctx.beginPath(); ctx.arc(kx, ky, 15, 0, 7); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.45)';
        ctx.beginPath(); ctx.arc(kx - 3, ky - 4, 8, 0, 7); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(kx, ky, 15, 0, 7); ctx.stroke();
      }
    }
  }
}
function orbBtn(r, col, spr, enabled, pressed, label) {
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2, rad = Math.min(r.w, r.h) / 2 - 3;
  ctx.globalAlpha = enabled ? 1 : .35;
  ctx.fillStyle = rgba(col, pressed ? .42 : .16);
  ctx.beginPath(); ctx.arc(cx, cy, rad, 0, 7); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = pressed ? 3 : 2;
  ctx.beginPath(); ctx.arc(cx, cy, rad, 0, 7); ctx.stroke();
  ctx.strokeStyle = rgba(col, .4); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, rad - 5, 0, 7); ctx.stroke();
  if (spr) {
    const sh = spr.height * .62, sw = spr.width * .62;
    ctx.drawImage(spr, cx - sw / 2, cy - sh / 2 - 4, sw, sh);
  }
  ctx.globalAlpha = 1;
  txt(label, cx, cy + rad - 7, col, 8, 'center');
}
function banner(t) {
  ctx.drawImage(SPR.banner, 0, H / 2 - 48);
  ctx.font = 'bold 26px monospace'; ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,.8)'; ctx.fillText(t, W / 2 + 2, H / 2 + 11);
  ctx.fillStyle = '#fff'; ctx.fillText(t, W / 2, H / 2 + 9);
  ctx.textAlign = 'left';
}
function center2(t, y, col, size) {
  ctx.fillStyle = col; ctx.font = `${size}px monospace`; ctx.textAlign = 'center';
  ctx.fillText(t, W/2, y); ctx.textAlign = 'left';

function btn(r, t, on) { // neon-outlined capsule
  ctx.fillStyle = on ? rgba(pack.accent, .24) : 'rgba(18,22,38,.6)';
  rrect(r.x, r.y, r.w, r.h, 12); ctx.fill();
  ctx.strokeStyle = on ? pack.accent : 'rgba(255,255,255,.32)';
  ctx.lineWidth = on ? 2 : 1.2;
  if (on) { ctx.shadowColor = pack.accent; ctx.shadowBlur = 10; }
  rrect(r.x, r.y, r.w, r.h, 12); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = on ? '#fff' : '#ccd';
  ctx.font = 'bold 15px monospace'; ctx.textAlign = 'center';
  ctx.fillText(t, r.x + r.w/2, r.y + r.h/2 + 5); ctx.textAlign = 'left';
}

function setPack(id){pack=PACKS[id];data.pack=id;unlocked=data[id].unlocked;titleSel=Math.min(titleSel,unlocked);$('#brand').textContent=pack.title;save();show()}
function setLayout(l){layout=l;data.layout=l;clearInputs();save();show()}
function show(){const panel=$('#panel');panel.classList.remove('hidden');$('#special').classList.add('hidden');const pausedScreen=paused&&mode==='play',r=data[pack.id].resume;let title=pausedScreen?'ROUTE ON HOLD':mode==='clear'?'SYSTEM SECURED':mode==='win'?'DELIVERY COMPLETE':mode==='gameover'?'FLIGHT ENDED':pack.title;let sub=pausedScreen?'The fleet can wait. Resume exactly where you left off.':mode==='clear'?`${pack.systems[chapter-1]} is clear. ${pack.jokes[chapter-1]}`:mode==='win'?`Eleven systems. One hundred and ten waves. One very tired pilot. Final score: ${score.toLocaleString()}. Your route is complete.`:mode==='gameover'?`Score ${score.toLocaleString()} · ${pack.systems[chapter-1]}, wave ${Math.min(10,waveIdx+1)}. Your cleared systems remain unlocked.`:`${pack.sub}. Fly eleven systems, break 110 formations, and send the flock home hungry.`;
panel.innerHTML=`<div class="card"><div class="eyebrow">${pack.sub}</div><h1>${title}</h1><div class="sub">${sub}</div>${mode==='title'?`<div class="row"><button id="pack">${pack.id==='replica'?'Play Cluck Horizon →':'← Play Orbital Flock'}</button><span style="font-size:12px;color:#b8cada">BEST ${data[pack.id].high.toLocaleString()} · ${unlocked}/11 SYSTEMS</span></div><div class="systems">${pack.systems.map((n,i)=>`<button class="system ${titleSel===i+1?'selected':''}" data-system="${i+1}" ${i+1>unlocked?'disabled':''}>${String(i+1).padStart(2,'0')} ${i+1>unlocked?'🔒':''}<br>${i===10&&unlocked<11?'Unknown route':n}</button>`).join('')}</div>`:''}<div class="row"><button class="primary" id="start">${pausedScreen?'Resume flight':mode==='clear'?'Next system':mode==='gameover'?'Retry system':mode==='win'?'Fly again':'Launch selected'}</button>${mode==='title'&&r?`<button id="continue">Continue ${r.chapter} / ${r.wave+1}</button>`:''}${mode!=='title'?'<button id="menu">Flight deck</button>':''}</div><div class="row"><label>Touch <select id="layout"><option value="B" ${layout==='B'?'selected':''}>One thumb · drag + auto-fire</option><option value="A" ${layout==='A'?'selected':''}>Two thumbs · stick + fire</option></select></label><label>Flight <select id="difficulty"><option value="classic" ${data.difficulty==='classic'?'selected':''}>Classic · four hulls</option><option value="cadet" ${data.difficulty==='cadet'?'selected':''}>Cadet · six hulls</option></select></label></div><div class="sub" style="font-size:12px">Move with ARROWS / WASD or drag. SPACE fires. X launches a screen-clearing special.<br>Gifts change weapons and raise power through ten levels. An extra gift reveals overcharge. Three rations replenish a special. Clear a system to earn a hull.</div></div>`;
$('#start').onclick=()=>{if(pausedScreen)return togglePause();if(mode==='clear')return startGame(chapter+1,true);if(mode==='gameover')return startGame(chapter);startGame(mode==='win'?1:titleSel)};if($('#pack'))$('#pack').onclick=()=>setPack(pack.id==='replica'?'cluck':'replica');if($('#continue'))$('#continue').onclick=()=>startGame(1,true);if($('#menu'))$('#menu').onclick=()=>{mode='title';paused=false;clearInputs();show()};for(const b of panel.querySelectorAll('[data-system]'))b.onclick=()=>{titleSel=+b.dataset.system;show()};$('#layout').onchange=e=>setLayout(e.target.value);$('#difficulty').onchange=e=>{data.difficulty=e.target.value;save()}}
function togglePause(){if(mode!=='play')return;paused=!paused;clearInputs();if(paused)show();else{$('#panel').classList.add('hidden');$('#special').classList.toggle('hidden',touchMode);audio()}}
function cvPos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
addEventListener('keydown',e=>{if(e.target.matches('select,input')||e.target.closest('button,a')&&['Space','Enter'].includes(e.code))return;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.repeat)return;if(e.code==='Escape'||e.code==='KeyP')return togglePause();if(mode==='title'){if(e.code==='Enter'||e.code==='Space')startGame(titleSel);if(e.code==='KeyT')setPack(pack.id==='replica'?'cluck':'replica');return}if(mode==='play'&&!paused){if(['Space','KeyZ'].includes(e.code)){audio();fireHeld=true}if(['KeyX','ShiftLeft','ShiftRight'].includes(e.code))fireMissile()}else if(e.code==='Enter'){if(mode==='clear')startGame(chapter+1,true);else if(mode==='gameover')startGame(chapter);else if(mode==='win'){mode='title';show()}}if(e.code==='KeyR'&&mode==='gameover')startGame(chapter)});
addEventListener('keyup',e=>{keys[e.code]=false;if(['Space','KeyZ'].includes(e.code))fireHeld=false});cv.addEventListener('contextmenu',e=>e.preventDefault());cv.addEventListener('pointerdown',e=>{if(mode!=='play'||paused)return;e.preventDefault();audio();cv.setPointerCapture(e.pointerId);let p=cvPos(e);if(e.pointerType==='touch'){touchMode=true;$('#special').classList.add('hidden');}const b=missileBtn();if(e.button===2||p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){fireMissile();return}if(e.pointerType==='touch'&&layout==='A'){if(p.x<W/2){if(!stick)stick={id:e.pointerId,ox:p.x,oy:p.y,x:p.x,y:p.y}}else{firePtrs.add(e.pointerId);fireHeld=true}}else{fireHeld=true;drag={id:e.pointerId,ox:p.x,oy:p.y,x:p.x,y:p.y,sx:ship.x,sy:ship.y}}});cv.addEventListener('pointermove',e=>{let p=cvPos(e);if(stick&&e.pointerId===stick.id){stick.x=p.x;stick.y=p.y}if(drag&&e.pointerId===drag.id){drag.x=p.x;drag.y=p.y}});
function release(e){firePtrs.delete(e.pointerId);if(stick&&stick.id===e.pointerId)stick=null;if(drag&&drag.id===e.pointerId)drag=null;if(!firePtrs.size)fireHeld=false}addEventListener('pointerup',release);addEventListener('pointercancel',release);addEventListener('blur',()=>{clearInputs();if(mode==='play'&&!paused)togglePause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play'&&!paused)togglePause()});$('#special').onclick=fireMissile;$('#pause').onclick=togglePause;$('#sound').onclick=()=>{data.muted=!data.muted;audio();save();$('#sound').textContent=data.muted?'♪ OFF':'♫ ON'};$('#sound').textContent=data.muted?'♪ OFF':'♫ ON';$('#volume').value=data.volume*100;$('#volume').oninput=e=>{data.volume=+e.target.value/100;audio();save()};
$('#brand').textContent=pack.title;
let acc=0,last=performance.now();function frame(now){acc+=Math.min(.08,(now-last)/1000);last=now;while(acc>=DT){step(DT);acc-=DT}draw();if(flash>0){ctx.fillStyle=`rgba(150,225,255,${flash*.6})`;ctx.fillRect(0,0,W,H)}requestAnimationFrame(frame)}show();requestAnimationFrame(frame);
Object.defineProperty(window,'__game',{value:Object.freeze({get state(){return{mode,paused,pack:pack.id,chapter,wave:Math.min(10,waveIdx+1),waveName:currentWave()?.name,score,lives,missiles:missileN,weapon:weaponLv,power,powerProfile:powerProfile(),food,unlocked,layout,touchMode,ship:ship?{...ship}:null,enemies:chickens.map(c=>({x:c.x,y:c.y,hp:c.hp,type:c.type,rock:c.rock,enter:!!c.enter})),eggs:eggs.map(e=>({...e})),pickups:pickups.map(p=>({...p})),boss:boss?{x:boss.x,y:boss.y,hp:boss.hp,max:boss.max,warn:boss.warn,name:boss.name}:null,lastDeath,resume:data[pack.id].resume?{...data[pack.id].resume}:null,high:data[pack.id].high}}})});
</script></html>
