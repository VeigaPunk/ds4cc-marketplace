<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Vex the Pitwright — pit engineer/fighter. Ember palette, chain hook, torch-lit pit. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#5a2a12"/>
      <stop offset="60%" stop-color="#2a130b"/>
      <stop offset="100%" stop-color="#120806"/>
    </radialGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5a3a"/>
      <stop offset="100%" stop-color="#4a2a18"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <!-- torch glow -->
  <circle cx="18" cy="30" r="10" fill="#ff9a3c" opacity="0.5"/>
  <circle cx="102" cy="30" r="10" fill="#ff9a3c" opacity="0.5"/>
  <circle cx="18" cy="30" r="4" fill="#ffd27a"/>
  <circle cx="102" cy="30" r="4" fill="#ffd27a"/>
  <!-- crowd silhouettes -->
  <g fill="#1a0d08" opacity="0.9">
    <ellipse cx="30" cy="112" rx="14" ry="10"/>
    <ellipse cx="60" cy="116" rx="18" ry="10"/>
    <ellipse cx="92" cy="112" rx="14" ry="10"/>
  </g>
  <!-- shoulders / armor -->
  <path d="M28 118 Q30 82 60 80 Q90 82 92 118 Z" fill="url(#armor)" stroke="#2a160c" stroke-width="2"/>
  <path d="M34 96 Q60 88 86 96" fill="none" stroke="#c98a4a" stroke-width="2" opacity="0.7"/>
  <!-- neck + head -->
  <rect x="52" y="66" width="16" height="16" rx="4" fill="#caa07a"/>
  <ellipse cx="60" cy="52" rx="20" ry="24" fill="#d4a97e"/>
  <!-- hair: short-cropped fighter cut -->
  <path d="M40 50 Q38 26 60 26 Q82 26 80 50 Q78 38 70 36 Q74 44 70 42 Q60 30 50 40 Q44 44 40 50 Z" fill="#3a2418"/>
  <!-- scar over left eye -->
  <path d="M48 44 L56 58" stroke="#8a4a3a" stroke-width="1.6" stroke-linecap="round"/>
  <!-- eyes: smirk expression -->
  <path d="M46 52 q5 -3 10 0" stroke="#2a160c" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M64 52 q5 -3 10 0" stroke="#2a160c" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- smirk -->
  <path d="M50 66 q10 6 20 -2" stroke="#7a3a2a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- chain hook over shoulder -->
  <path d="M84 84 q14 -6 16 -18 q1 -8 -6 -8 q-6 0 -6 6" fill="none" stroke="#9a9a9a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="88" cy="64" r="3" fill="none" stroke="#9a9a9a" stroke-width="2"/>
  <!-- ember rim light -->
  <path d="M40 50 Q38 26 60 26" fill="none" stroke="#ffb060" stroke-width="1.5" opacity="0.8"/>
  <path d="M28 118 Q30 82 60 80" fill="none" stroke="#ff9a3c" stroke-width="1.5" opacity="0.5"/>
</svg>
