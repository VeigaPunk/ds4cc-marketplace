<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- The Oddsmaker — shadowed fixer/dealer. Violet-dark, hood, dice and coin. -->
  <defs>
    <radialGradient id="bg3" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#3a2a5a"/>
      <stop offset="60%" stop-color="#1c1230"/>
      <stop offset="100%" stop-color="#0a0614"/>
    </radialGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3a6a"/>
      <stop offset="100%" stop-color="#241838"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" fill="url(#bg3)"/>
  <!-- smoke wisps -->
  <path d="M16 100 q10 -14 4 -28 q-4 -10 6 -18" fill="none" stroke="#5a4a7a" stroke-width="2" opacity="0.5"/>
  <path d="M104 100 q-10 -14 -4 -28 q4 -10 -6 -18" fill="none" stroke="#5a4a7a" stroke-width="2" opacity="0.5"/>
  <!-- hooded cloak -->
  <path d="M24 118 Q26 78 60 74 Q94 78 96 118 Z" fill="url(#hood)" stroke="#120a20" stroke-width="2"/>
  <!-- hood over head -->
  <path d="M36 58 Q34 22 60 20 Q86 22 84 58 Q82 44 74 40 Q78 52 72 48 Q66 34 60 34 Q54 34 48 48 Q42 52 46 40 Q38 44 36 58 Z" fill="#2e2046" stroke="#120a20" stroke-width="1.5"/>
  <!-- shadowed face: only eyes + grin visible -->
  <ellipse cx="60" cy="54" rx="17" ry="20" fill="#17102a"/>
  <!-- glowing eyes -->
  <path d="M48 52 q5 -4 10 -1" stroke="#e8c85a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M62 51 q5 -3 10 1" stroke="#e8c85a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- knowing grin -->
  <path d="M50 64 q10 5 20 -1" stroke="#b89a4a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- coin flip in hand -->
  <circle cx="92" cy="88" r="7" fill="#d4af5a" stroke="#8a6a2a" stroke-width="1.5"/>
  <text x="92" y="92" font-size="9" text-anchor="middle" fill="#6a4a1a" font-family="serif">?</text>
  <path d="M86 78 q6 -8 12 -2" fill="none" stroke="#d4af5a" stroke-width="1.5" opacity="0.7"/>
  <!-- dice -->
  <g transform="translate(22 92) rotate(-12)">
    <rect width="12" height="12" rx="2" fill="#e8e0d0" stroke="#8a7a5a"/>
    <circle cx="4" cy="4" r="1.2" fill="#3a2a1a"/><circle cx="8" cy="8" r="1.2" fill="#3a2a1a"/>
  </g>
  <g transform="translate(30 100) rotate(8)">
    <rect width="12" height="12" rx="2" fill="#e8e0d0" stroke="#8a7a5a"/>
    <circle cx="3.5" cy="3.5" r="1.2" fill="#3a2a1a"/><circle cx="8.5" cy="3.5" r="1.2" fill="#3a2a1a"/>
    <circle cx="3.5" cy="8.5" r="1.2" fill="#3a2a1a"/><circle cx="8.5" cy="8.5" r="1.2" fill="#3a2a1a"/>
  </g>
  <!-- rim light -->
  <path d="M36 58 Q34 22 60 20" fill="none" stroke="#9a7ae8" stroke-width="1.5" opacity="0.8"/>
</svg>
