<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 40">
  <!-- Keyword icon strip: Guard, Blitz, Pierce, Deathcry, Warcry, Ward — 40px each, hand-authored. -->
  <!-- Guard: shield wall -->
  <g transform="translate(0 0)">
    <rect width="40" height="40" rx="6" fill="#1c2a3a"/>
    <path d="M20 6 L32 11 V20 Q32 30 20 35 Q8 30 8 20 V11 Z" fill="#4a7ab8" stroke="#9abbe8" stroke-width="1.5"/>
    <path d="M20 12 V30" stroke="#9abbe8" stroke-width="1.5"/>
  </g>
  <!-- Blitz: lightning -->
  <g transform="translate(40 0)">
    <rect width="40" height="40" rx="6" fill="#3a2a10"/>
    <path d="M23 5 L13 22 H20 L16 35 L29 17 H21 Z" fill="#ffd23c" stroke="#b8860b" stroke-width="1"/>
  </g>
  <!-- Pierce: arrow through -->
  <g transform="translate(80 0)">
    <rect width="40" height="40" rx="6" fill="#2a1a2a"/>
    <path d="M6 20 H30" stroke="#d88ae8" stroke-width="3"/>
    <path d="M26 12 L36 20 L26 28 Z" fill="#d88ae8"/>
    <path d="M12 14 L18 20 L12 26" fill="none" stroke="#8a4a9a" stroke-width="2"/>
  </g>
  <!-- Deathcry: skull -->
  <g transform="translate(120 0)">
    <rect width="40" height="40" rx="6" fill="#1a2a1a"/>
    <ellipse cx="20" cy="17" rx="10" ry="9" fill="#d8d8c8" stroke="#7a7a6a"/>
    <rect x="14" y="22" width="12" height="6" rx="2" fill="#d8d8c8" stroke="#7a7a6a"/>
    <circle cx="16" cy="16" r="2.4" fill="#1a2a1a"/><circle cx="24" cy="16" r="2.4" fill="#1a2a1a"/>
    <path d="M20 19 l-1.5 3 h3 Z" fill="#1a2a1a"/>
    <path d="M16 25 v3 M20 25 v3 M24 25 v3" stroke="#7a7a6a" stroke-width="1"/>
  </g>
  <!-- Warcry: war horn -->
  <g transform="translate(160 0)">
    <rect width="40" height="40" rx="6" fill="#3a1a14"/>
    <path d="M8 26 Q10 14 26 10 L30 14 Q18 18 14 28 Z" fill="#c98a4a" stroke="#8a5a2a" stroke-width="1.5"/>
    <path d="M28 8 q6 2 6 8" fill="none" stroke="#e8b86a" stroke-width="2"/>
    <path d="M30 14 q8 2 8 10" fill="none" stroke="#e8b86a" stroke-width="1.5" opacity="0.7"/>
  </g>
  <!-- Ward: bubble -->
  <g transform="translate(200 0)">
    <rect width="40" height="40" rx="6" fill="#142a30"/>
    <circle cx="20" cy="20" r="12" fill="none" stroke="#6ad8e8" stroke-width="2.5" opacity="0.9"/>
    <circle cx="20" cy="20" r="12" fill="#6ad8e8" opacity="0.15"/>
    <path d="M14 14 q3 -3 6 -2" fill="none" stroke="#c8f4ff" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
