<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0b0b0e">
<meta name="description" content="Enduro Classic: the 1983 endurance race as the cartridge drew it. Pass 200 cars on day one and 300 every day after, through snow, dusk, night and fog. Arrow keys to drive.">
<title>Enduro — Classic</title>
<link rel="canonical" href="https://ds4cc.com/magga/enduro/classic/">
<meta property="og:title" content="Enduro — Classic">
<meta property="og:description" content="The 1983 endurance race as the cartridge drew it. Arrow keys to drive.">
<meta property="og:url" content="https://ds4cc.com/magga/enduro/classic/">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%233840b0'/%3E%3Crect y='6' width='16' height='10' fill='%23407c40'/%3E%3Cpath d='M7 6h2l5 10H2z' fill='%23b0b0b0'/%3E%3Crect x='5' y='11' width='6' height='4' fill='%23dcdcdc'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b0b0e;
    --ink: #e9e6dc;
    --dim: #8f8b80;
    --line: #2b2a30;
    --red: #b03c3c;
    --yellow: #d0d050;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.5 ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
    display: flex; flex-direction: column;
    height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 16px; border-bottom: 1px solid var(--line);
    flex: none;
  }
  header a { color: var(--ink); text-decoration: none; letter-spacing: 1px; }
  header a:hover, header a:focus-visible { color: var(--yellow); }
  .title { flex: 1; text-align: center; letter-spacing: 4px; font-weight: bold; }
  .title span { color: var(--dim); font-weight: normal; letter-spacing: 2px; }
  button {
    font: inherit; font-size: 11px; letter-spacing: 1px;
    background: #17161b; color: var(--ink); border: 1px solid var(--line);
    padding: 5px 10px; border-radius: 3px; cursor: pointer;
  }
  button:hover:not(:disabled), button:focus-visible { border-color: var(--yellow); outline: none; }
  button:disabled { opacity: .45; cursor: default; }
  .stripes { height: 6px; flex: none; background: linear-gradient(180deg,
    #e34234 0 17%, #f08a24 17% 34%, #f2c12e 34% 51%, #6cbf4b 51% 68%, #3b8fd6 68% 85%, #7c4dbb 85% 100%); }
  #tv {
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 12px 16px;
  }
  .bezel {
    padding: 14px; border-radius: 18px;
    background: radial-gradient(ellipse at 50% 30%, #2a2930, #141317 70%);
    box-shadow: inset 0 0 0 2px #000, 0 18px 40px rgba(0,0,0,.6);
  }
  canvas {
    display: block; image-rendering: pixelated; image-rendering: crisp-edges;
    border-radius: 6px; background: #000; touch-action: none;
  }
  footer { flex: none; text-align: center; padding: 6px 16px 12px; }
  #msg { margin: 0; font-size: 14px; min-height: 21px; }
  #msg b { color: var(--yellow); font-weight: bold; }
  .keys { margin: 4px 0 0; color: var(--dim); font-size: 12px; }
  .keys kbd { color: var(--ink); font-family: inherit; }
  #best { margin: 2px 0 0; color: var(--dim); font-size: 11px; letter-spacing: 1px; }
  #pads { display: none; }
  @media (pointer: coarse) {
    .keys { display: none; }
    #pads {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 0 16px calc(12px + env(safe-area-inset-bottom));
      flex: none;
    }
    #pads div { display: flex; gap: 10px; }
    #pads button {
      width: 76px; height: 68px; font-size: 22px; border-radius: 14px;
      background: #1b1a20; border: 1px solid #3a3940; touch-action: none;
      color: var(--ink); padding: 0;
    }
    #pads button[data-pad="accel"] { width: 92px; }
    #pads button.on { background: var(--red); border-color: var(--yellow); }
  }
  /* Phones held sideways: the picture takes the height, pads sit beside it. */
  @media (pointer: coarse) and (orientation: landscape) and (max-height: 560px) {
    header { padding: 4px 12px; }
    .stripes { height: 3px; }
    #tv { padding: 4px calc(96px + env(safe-area-inset-right)) 4px calc(146px + env(safe-area-inset-left)); }
    .bezel { padding: 4px; border-radius: 8px; }
    footer { padding: 2px 8px 4px; }
    #msg { font-size: 12px; min-height: 18px; }
    #best { display: none; }
    #pads {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
      padding: 0 calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
      pointer-events: none;
    }
    #pads { align-items: flex-end; }
    #pads div { pointer-events: auto; gap: 8px; }
    #pads div:last-child { flex-direction: column-reverse; }
    #pads button { background: rgba(27, 26, 32, .72); width: 62px; height: 70px; }
    #pads button[data-pad="accel"] { width: 76px; height: 84px; }
    #pads button[data-pad="brake"] { width: 76px; height: 54px; }
  }
  @media (max-width: 520px) {
    .title span { display: none; }
    header { padding: 8px 10px; }
    #tv { padding: 8px; }
    .bezel { padding: 6px; border-radius: 10px; }
    #msg { font-size: 13px; }
  }
</style>
</head>
<body>
<header>
  <a href="../">← ENDURO</a>
  <div class="title">ENDURO <span>· CLASSIC 1983</span></div>
  <button id="pause" type="button" disabled>PAUSE</button>
  <button id="mute" type="button" aria-pressed="false">SOUND ON</button>
</header>
<div class="stripes" aria-hidden="true"></div>
<main id="tv">
  <div class="bezel"><canvas id="screen" width="320" height="192" aria-label="Enduro race screen"></canvas></div>
</main>
<footer>
  <p id="msg" aria-live="polite"></p>
  <p class="keys"><kbd>← →</kbd> steer · <kbd>↑</kbd> / <kbd>SPACE</kbd> accelerate (let go to hold speed) · <kbd>↓</kbd> brake · <kbd>P</kbd> pause · <kbd>M</kbd> sound · <kbd>ENTER</kbd> reset</p>
  <p id="best"></p>
</footer>
<div id="pads" aria-hidden="true">
  <div><button type="button" data-pad="left">◀</button><button type="button" data-pad="right">▶</button></div>
  <div><button type="button" data-pad="brake">▼</button><button type="button" data-pad="accel">▲</button></div>
</div>
<script src="../core.js"></script>
<script src="../shell.js"></script>
<script src="classic.js"></script>
</body>
</html>
