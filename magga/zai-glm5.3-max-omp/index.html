<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARCADE NIGHTS — zai-glm5.3-max-omp</title>
<meta name="description" content="Seven self-contained browser games from one run: survival, one-button rhythm, supply-chain satire, two shooter packs, a gladiator ladder and 114 mazes. zai-glm5.3-max-omp edition.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  /* Furoshiki presentation (Plazir-15 signature): the games are the contents;
     this page is the wrap. Cloth-hem frames, one musubi knot per package. */
  :root {
    /* Plazir-15 Fan Codex identity — same tokens as /magga/ + every edition */
    --bg: #070d10; --bg-deep: #05090b; --cloth: #0f191e; --hem: color-mix(in oklab, #e8f0f2 12%, transparent); --hem-bright: #6baa88;
    --ink: #e8f0f2; --dim: #9aafb6; --accent: #6baa88; --knot: #5aa8a0; --focus: #9ee0d4;
    --font: "JetBrainsMonoNL Nerd Font Mono", "JetBrains Mono", ui-monospace, monospace;
  }
  @font-face { font-family: "JetBrainsMonoNL Nerd Font Mono"; src: url("../assets/fonts/JetBrainsMonoNLNerdFontMono-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "JetBrainsMonoNL Nerd Font Mono"; src: url("../assets/fonts/JetBrainsMonoNLNerdFontMono-Medium.woff2") format("woff2"); font-weight: 500; font-display: swap; }
  @font-face { font-family: "JetBrainsMonoNL Nerd Font Mono"; src: url("../assets/fonts/JetBrainsMonoNLNerdFontMono-Bold.woff2") format("woff2"); font-weight: 600 700; font-display: swap; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background-color: var(--bg); color: var(--ink);
    font-family: var(--font); min-height: 100%;
    background-image:
      radial-gradient(ellipse 110% 70% at 50% -15%, color-mix(in oklab, #5aa8a0 14%, transparent), transparent 55%),
      radial-gradient(ellipse 50% 40% at 100% 30%, color-mix(in oklab, #3f6f58 12%, transparent), transparent 50%),
      linear-gradient(180deg, var(--bg-deep) 0%, var(--bg) 45%, #0a1418 100%);
    background-attachment: fixed; -webkit-font-smoothing: antialiased; }
  main { max-width: 1060px; margin: 0 auto; padding: 28px 20px 56px; }
  header { text-align: center; padding: 30px 0 6px; }
  .mark { width: 44px; height: 44px; margin: 0 auto 10px; display: block; }
  h1 { font-size: clamp(26px, 5vw, 42px); letter-spacing: .12em; margin: 0;
    color: var(--accent); text-shadow: 3px 3px 0 #173027; font-weight: 700; }
  .sub { color: var(--dim); margin: 10px 0 0; letter-spacing: .1em; font-size: 12px; }
  .sub b { color: var(--ink); font-weight: 700; }
  .grid { display: grid; gap: 20px; margin-top: 30px;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  /* the wrapped package: cloth card with a folded hem (inset outline) and a knot */
  a.card { display: block; position: relative; background: var(--cloth);
    border: 1px solid var(--hem); border-radius: 10px; padding: 20px 18px 16px;
    text-decoration: none; color: var(--ink);
    transition: transform .14s ease, border-color .14s ease, box-shadow .14s ease; }
  a.card::before { content: ""; position: absolute; inset: 5px; border: 1px solid var(--hem);
    border-radius: 6px; pointer-events: none; transition: border-color .14s ease; }
  a.card:hover, a.card:focus-visible { transform: translateY(-3px);
    border-color: var(--hem-bright);
    box-shadow: 0 10px 28px rgba(0,0,0,.45); }
  a.card:hover::before { border-color: color-mix(in oklab, #6baa88 40%, transparent); }
  .knot { position: absolute; top: -11px; left: 50%; transform: translateX(-50%);
    width: 26px; height: 26px; background: var(--bg); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; }
  .kicker { font-size: 10px; letter-spacing: .22em; color: var(--dim); }
  .card h2 { margin: 6px 0 4px; font-size: 17px; letter-spacing: .06em; color: var(--accent); }
  .card p { margin: 0; color: var(--dim); font-size: 12px; line-height: 1.55; }
  .art { height: 94px; margin: -4px -4px 12px; border-radius: 6px; display: block;
    width: calc(100% + 8px); object-fit: cover; border: 1px solid var(--hem); }
  footer { text-align: center; color: var(--dim); font-size: 11px; margin-top: 44px; line-height: 1.7; }
  footer a { color: var(--dim); }
  footer a:hover { color: var(--accent); }
  @media (pointer: coarse) { a.card { padding: 16px; } .art { height: 74px; } }
</style>
</head>
<body>
<main>
  <header>
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <rect x="15" y="15" width="34" height="34" rx="3" transform="rotate(45 32 32)" fill="#152228" stroke="#6baa88" stroke-width="2.5"/>
      <path d="M20 27 Q32 20 44 27" stroke="#6baa88" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M20 37 Q32 44 44 37" stroke="#6baa88" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="32" cy="32" r="5.5" fill="#6baa88" stroke="#5aa8a0" stroke-width="1.5"/>
    </svg>
    <h1>ARCADE NIGHTS</h1>
    <p class="sub">SEVEN GAMES · ONE RUN · <b>zai-glm5.3-max-omp</b> · KEYBOARD · MOUSE · TOUCH</p>
  </header>

  <div class="grid" id="grid"></div>

  <footer>
    Every game is a self-contained page — it runs offline from this folder.<br>
    Original evocations of classics: mechanics and feel honored, art and names our own.<br>
    <a href="https://github.com/VeigaPunk/MAKEARMORGAMESGREATAGAIN-zai">source & ship records</a>
    · <a href="https://raw.githubusercontent.com/VeigaPunk/1shot/main/magga/one-shot-prompt.md">[oneshotprompt(magga)]</a>
  </footer>
</main>

<script>
// Cards: cover art is actual game footage — captured from the shipped pages.
const GAMES = [
  {
    href: 'games/boxhead/index.html',
    kicker: 'ARENA SURVIVAL · 1–2 PLAYERS',
    title: 'BLOCKHEAD: ARENA NIGHTS',
    desc: 'Endless zombie waves, kill-streak weapon escalations, explosive barrels. Solo, shared-keyboard co-op, or deathmatch.',
    art: 'covers/boxhead.png',
  },
  {
    href: 'games/impossible/index.html',
    kicker: 'ONE-BUTTON RHYTHM RUNNER',
    title: 'IMPOSSIBLE RUN',
    desc: 'An auto-running cube, a fixed-impulse jump, five tracks of spikes and gaps. Die, restart instantly, learn the rhythm.',
    art: 'covers/impossible.png',
  },
  {
    href: 'games/burger-tycoon/index.html',
    kicker: 'SUPPLY-CHAIN SATIRE SIM',
    title: 'BURGER TYCOON',
    desc: 'Four panes, one ruthless economy. Farmland, feedlot, restaurant, HQ — dirty shortcuts raise profit and backlash.',
    art: 'covers/burger-tycoon.png',
  },
  {
    href: 'games/chicken-invaders/index.html',
    kicker: 'VERTICAL SHOOT-’EM-UP',
    title: 'GALACTIC CHICKEN: NEXT WAVE',
    desc: 'Ten chapters from the rim of the system to the Sun. Formations, gift weapon power, missiles, chapter bosses.',
    art: 'covers/chicken-invaders.png',
  },
  {
    href: 'games/cluck-horizon/index.html',
    kicker: 'ORIGINAL-IP SHOOT-’EM-UP',
    title: 'CLUCK HORIZON',
    desc: 'A courier pilot versus the space flock. Kitchen-tech weapons, supply crates, overgrown chapter bosses.',
    art: 'covers/chicken-invaders-original.png',
  },
  {
    href: 'games/swords-and-sandals/index.html',
    kicker: 'GLADIATOR RPG · TURN-BASED',
    title: 'SANDALS OF STEEL',
    desc: 'Forge a gladiator, fight a ladder of arena champions, buy steel and spells, dethrone the Emperor.',
    art: 'covers/swords-and-sandals.png',
  },
  {
    href: 'games/hardest/index.html',
    kicker: 'PRECISION DODGE MAZES',
    title: 'THE WORLD’S CRUELEST GAME',
    desc: 'A red square, patrolling dots, 114 mazes of coins, keys, doors and teleporters. Every death is your fault.',
    art: 'covers/hardest.png',
  },
];

// one musubi per package — the knot that ties the wrap
const KNOT = '<span class="knot" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 64 64">'
  + '<rect x="16" y="16" width="32" height="32" rx="3" transform="rotate(45 32 32)" fill="none" stroke="#6baa88" stroke-width="5"/>'
  + '<circle cx="32" cy="32" r="6" fill="#6baa88"/></svg></span>';

const grid = document.getElementById('grid');
for (const g of GAMES) {
  const a = document.createElement('a');
  a.className = 'card';
  a.href = g.href;
  a.innerHTML = KNOT
    + '<img class="art" src="' + g.art + '" alt="" loading="lazy">'
    + '<div class="kicker">' + g.kicker + '</div>'
    + '<h2>' + g.title + '</h2>'
    + '<p>' + g.desc + '</p>';
  grid.appendChild(a);
}
</script>
</body>
</html>
