<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0b0b0e">
<meta name="description" content="Frostbite Classic: the 1983 arctic igloo builder as the cartridge drew it. Hop the ice floes, raise the igloo before the temperature hits zero, dodge geese, crabs, clams and the polar grizzly. Arrow keys or touch.">
<title>Frostbite — Classic</title>
<link rel="canonical" href="https://ds4cc.com/magga/frostbite/classic/">
<meta property="og:title" content="Frostbite — Classic">
<meta property="og:description" content="The 1983 arctic igloo builder as the cartridge drew it. Arrow keys or touch.">
<meta property="og:url" content="https://ds4cc.com/magga/frostbite/classic/">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%237c9cdc'/%3E%3Crect y='9' width='16' height='7' fill='%231c3890'/%3E%3Crect x='3' y='3' width='10' height='2' fill='%23ececec'/%3E%3Crect x='2' y='5' width='12' height='3' fill='%23ececec'/%3E%3Crect x='7' y='6' width='2' height='2' fill='%23000'/%3E%3Crect x='2' y='11' width='5' height='2' fill='%23ececec'/%3E%3Crect x='9' y='13' width='5' height='2' fill='%2390b4ec'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b0b0e;
    --ink: #e9e6dc;
    --dim: #8f8b80;
    --line: #2b2a30;
    --ice: #a4c8fc;
    --red: #b03c3c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.5 ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
    display: flex; flex-direction: column;
    height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  header {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 16px; border-bottom: 1px solid var(--line);
    flex: none;
  }
  header a { color: var(--ink); text-decoration: none; letter-spacing: 1px; white-space: nowrap; }
  header a:hover, header a:focus-visible { color: var(--ice); }
  .title { flex: 1; text-align: center; letter-spacing: 4px; font-weight: bold; white-space: nowrap; }
  .title span { color: var(--dim); font-weight: normal; letter-spacing: 2px; }
  button {
    font: inherit; font-size: 11px; letter-spacing: 1px;
    background: #17161b; color: var(--ink); border: 1px solid var(--line);
    padding: 5px 10px; border-radius: 3px; cursor: pointer; white-space: nowrap;
  }
  button:hover:not(:disabled), button:focus-visible { border-color: var(--ice); outline: none; }
  button:disabled { opacity: .45; cursor: default; }
  .stripes { height: 6px; flex: none; background: linear-gradient(180deg,
    #ececec 0 20%, #a4c8fc 20% 40%, #7c9cdc 40% 60%, #5070bc 60% 80%, #1c3890 80% 100%); }
  #tv {
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 12px 16px;
  }
  .bezel {
    padding: 14px; border-radius: 18px;
    background: radial-gradient(ellipse at 50% 30%, #2a2930, #141317 70%);
    box-shadow: inset 0 0 0 2px #000, 0 18px 40px rgba(0,0,0,.6);
  }
  canvas {
    display: block; image-rendering: pixelated; image-rendering: crisp-edges;
    border-radius: 6px; background: #000; touch-action: none;
  }
  footer { flex: none; text-align: center; padding: 6px 16px 12px; }
  #msg { margin: 0; font-size: 14px; min-height: 21px; }
  #msg b { color: var(--ice); font-weight: bold; }
  .keys { margin: 4px 0 0; color: var(--dim); font-size: 12px; }
  .keys kbd { color: var(--ink); font-family: inherit; }
  #best { margin: 2px 0 0; color: var(--dim); font-size: 11px; letter-spacing: 1px; }
  #pads { display: none; }
  @media (pointer: coarse) {
    .keys { display: none; }
    #pads {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      padding: 0 16px calc(12px + env(safe-area-inset-bottom));
      flex: none;
    }
    #pads > div { display: flex; gap: 10px; }
    #pads .jump { flex-direction: column; gap: 8px; }
    #pads button {
      width: 72px; height: 62px; font-size: 22px; border-radius: 14px;
      background: #1b1a20; border: 1px solid #3a3940; touch-action: none;
      color: var(--ink); padding: 0;
    }
    #pads .jump button { width: 84px; height: 56px; }
    #pads button[data-pad="fire"] { width: 64px; height: 64px; border-radius: 50%; background: #3a1414; border-color: #6a2a2a; font-size: 20px; }
    #pads button.on { background: #2c4a86; border-color: var(--ice); }
    #pads button[data-pad="fire"].on { background: var(--red); border-color: #fcb4b4; }
  }
  /* Phones held sideways: the picture takes the height, pads sit beside it. */
  @media (pointer: coarse) and (orientation: landscape) and (max-height: 560px) {
    header { padding: 4px 12px; }
    .stripes { height: 3px; }
    #tv { padding: 4px calc(112px + env(safe-area-inset-right)) 4px calc(160px + env(safe-area-inset-left)); }
    .bezel { padding: 4px; border-radius: 8px; }
    footer { padding: 2px 8px 4px; }
    #msg { font-size: 12px; min-height: 18px; }
    #best { display: none; }
    #pads {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
      padding: 0 calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
      pointer-events: none; align-items: flex-end;
    }
    #pads > div { pointer-events: auto; gap: 8px; }
    #pads .fire { position: fixed; left: calc(16px + env(safe-area-inset-left)); bottom: calc(96px + env(safe-area-inset-bottom)); }
    #pads button { background: rgba(27, 26, 32, .72); width: 66px; height: 70px; }
    #pads .jump button { width: 92px; height: 58px; }
  }
  @media (max-width: 520px) {
    .title { visibility: hidden; flex: 1; min-width: 0; }
    header { padding: 8px 10px; gap: 6px; }
    #tv { padding: 8px; }
    .bezel { padding: 6px; border-radius: 10px; }
    #msg { font-size: 12px; }
    button { padding: 5px 7px; font-size: 10px; letter-spacing: 0; }
  }
  @media (max-width: 370px) {
    .title { letter-spacing: 2px; }
    #pads button { width: 62px; }
    #pads .jump button { width: 74px; }
  }
</style>
</head>
<body>
<header>
  <a href="../">← FROSTBITE</a>
  <div class="title">FROSTBITE <span>· CLASSIC 1983</span></div>
  <button id="select" type="button">GAME 1</button>
  <button id="pause" type="button" disabled>PAUSE</button>
  <button id="mute" type="button" aria-pressed="false">SOUND ON</button>
</header>
<div class="stripes" aria-hidden="true"></div>
<main id="tv">
  <div class="bezel"><canvas id="screen" width="320" height="192" aria-label="Frostbite playfield"></canvas></div>
</main>
<footer>
  <p id="msg" aria-live="polite"></p>
  <p class="keys"><kbd>← →</kbd> walk · <kbd>↑ ↓</kbd> jump between floes · <kbd>SPACE</kbd> reverse your floe (costs a block) · <kbd>G</kbd> game · <kbd>P</kbd> pause · <kbd>M</kbd> sound</p>
  <p id="best"></p>
</footer>
<div id="pads" aria-hidden="true">
  <div class="move"><button type="button" data-pad="left">◀</button><button type="button" data-pad="right">▶</button></div>
  <div class="fire"><button type="button" data-pad="fire" aria-label="Reverse floe">⟲</button></div>
  <div class="jump"><button type="button" data-pad="up">▲</button><button type="button" data-pad="down">▼</button></div>
</div>
<script src="../core.js"></script>
<script src="../shell.js"></script>
<script src="classic.js"></script>
</body>
</html>
