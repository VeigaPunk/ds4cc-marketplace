name: Validate Plugin Manifests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate marketplace manifest with Rust
        run: cargo test --manifest-path marketplace/validator/Cargo.toml

      - name: Validate agent payload metadata
        run: node scripts/validate-agent-payloads.mjs
