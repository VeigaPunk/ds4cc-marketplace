name: Validate Plugin Manifests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace manifest (strict)
        run: claude plugin validate --strict .claude-plugin/marketplace.json

      - name: Validate every plugin directory (strict)
        run: |
          set -euo pipefail
          for dir in marketplace/plugins/*/; do
            echo "== ${dir}"
            claude plugin validate --strict "${dir}"
          done
