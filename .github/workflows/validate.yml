name: Validate Plugin Manifests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ds4cc-marketplace

      - name: Checkout standalone authority
        uses: actions/checkout@v4
        with:
          repository: VeigaPunk/myagents
          path: myagents

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate marketplace manifest with Rust
        run: cargo test --manifest-path ds4cc-marketplace/marketplace/validator/Cargo.toml

      - name: Validate agent payload metadata
        working-directory: ds4cc-marketplace
        run: node scripts/validate-agent-payloads.mjs
