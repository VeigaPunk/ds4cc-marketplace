# Schema still has a "claude" lane key for the legacy host binary path.
# Values are non-Anthropic: fleet policy is Grok + ChatGPT (OpenAI/Codex).
claude:
  default: grok-4.5
  effort: high
codex:
  default: gpt-5.6-sol
  reasoning_effort: low
  features:
    fast_mode: true
gemma:
  # Route: gemma-hvm → run.sh/run-hvm4.sh → Bend 0.2.38 gen-hvm → HVM4 4.0 control gate → Ollama.
  # Override with HVM_GEMMA_MODEL / HVM_GEMMA_BIN. xbreed prefix: g-
  default: gemma4:26b
  transport: hvm
  bin: gemma-hvm
# Legacy key — same lane as gemma (cloud Gemini retired 2026-07-21).
gemini:
  default: gemma4:26b
  transport: hvm
  bin: gemma-hvm
